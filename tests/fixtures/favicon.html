<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Favicon test</title>
  </head>
  <body>
    <p>Names the favicon in ?icon=..., several in ?icons=a,b,c, or with ?churn=N changes it N times in quick succession.</p>
    <script>
      const params = new URLSearchParams(location.search);
      const link = document.createElement('link');
      link.rel = 'icon';
      document.head.append(link);
      const churn = Number(params.get('churn') || 0);
      if (churn > 0) {
        let i = 0;
        const next = () => {
          link.href = 'icon.png?v=' + i;
          if (++i < churn) setTimeout(next, 10);
        };
        next();
      } else if (params.get('icon')) {
        link.href = params.get('icon');
      } else if (params.get('icons')) {
        // Several favicons, tried in order: ?icons=a.png,b.png
        const [first, ...rest] = params.get('icons').split(',');
        link.href = first;
        for (const href of rest) {
          const extra = document.createElement('link');
          extra.rel = 'icon';
          extra.href = href;
          document.head.append(extra);
        }
      }
    </script>
  </body>
</html>
