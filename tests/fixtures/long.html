<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Long page</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: linear-gradient(#ffffff, #c9d6ff);
      }
      section {
        height: 400px;
        border-bottom: 1px solid #99a;
        padding: 20px;
        box-sizing: border-box;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <script>
      for (let i = 1; i <= 15; i++) {
        const s = document.createElement('section');
        s.textContent = 'Section ' + i;
        document.body.append(s);
      }
    </script>
  </body>
</html>
